# ── Demonic Music Host – nginx reverse proxy ─────────────────────────────────
# Place this file at: /etc/nginx/sites-available/demonicmusichost
# Then: ln -s /etc/nginx/sites-available/demonicmusichost \
#             /etc/nginx/sites-enabled/demonicmusichost
#
# Prerequisites:
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d <YOUR_DOMAIN>
#
# After certbot the SSL block will be filled in automatically.
# Replace <YOUR_DOMAIN> with your actual domain name everywhere below.
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zone – 20 req/s per IP, burst of 50
limit_req_zone $binary_remote_addr zone=dmh_api:10m rate=20r/s;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name <YOUR_DOMAIN>;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <YOUR_DOMAIN>;

    # SSL certificates (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # Logging
    access_log /var/log/nginx/demonicmusichost_access.log;
    error_log  /var/log/nginx/demonicmusichost_error.log warn;

    # Gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # ── WebSocket upgrade (must come before the general proxy block) ──────────
    location /ws/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive longer (30 min)
        proxy_read_timeout  1800s;
        proxy_send_timeout  1800s;
    }

    # ── Spotify OAuth callback (no rate limit) ────────────────────────────────
    location /auth/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── API endpoints (rate-limited) ──────────────────────────────────────────
    location /api/ {
        limit_req zone=dmh_api burst=50 nodelay;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Everything else (static files served by Ktor, sessions, health) ───────
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Cache static assets aggressively (JS/CSS have content hashes in prod)
        location ~* \.(js|css|png|ico|svg|woff2?)$ {
            proxy_pass http://127.0.0.1:8080;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
